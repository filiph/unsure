name: unsure_example
description: Web example and interactive calculator for package:unsure using Jaspr.
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  jaspr: ^0.23.5
  logging: ^1.3.0
  unsure:
    path: ../
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.15
  build_web_compilers: ^4.1.2
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: client
  uses-flutter: false
